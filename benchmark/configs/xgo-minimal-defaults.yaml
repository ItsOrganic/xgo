watch:
  dirs: ["."]
  include: ["*.go"]
  exclude: []
  # debounce intentionally omitted - uses xgo's own built-in default (50ms)

build:
  # matches xgo's own shipped default (config.DefaultBuildCmd) - the
  # stripping flags are part of what you get out of the box, exactly like
  # the 50ms debounce. fair mode deliberately drops them so every tool
  # builds with an identical command.
  cmd: "go build -ldflags=\"-s -w\" -o ./tmp/xgo-app ."
  timeout: 30s

run:
  cmd: "./tmp/xgo-app"

log:
  timestamps: false
  color: false
